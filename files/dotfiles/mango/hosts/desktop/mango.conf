# Desktop: sourced from config.conf via ~/.config/mango-host (home/mango.nix links
# this directory there). Only what differs between machines lives here.

# monitors: 1440p on the left, 4K on the right at 1.5x (4K becomes 2560 wide)
monitor_rule=name:HDMI-A-2,x:0,y:0,scale:1
monitor_rule=name:HDMI-A-1,x:2560,y:0,scale:1.5
