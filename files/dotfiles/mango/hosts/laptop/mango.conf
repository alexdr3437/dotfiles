# Work laptop: sourced from config.conf via ~/.config/mango-host (home/mango.nix links
# this directory there). Only what differs between machines lives here.
#
# One external monitor, internal panel (probably eDP-1: confirm with
# `mmsg get all-monitors`) off while docked. Nothing is pinned yet: with no rules
# mango lays the outputs out side by side at scale 1.
#
# Lid handling (needs HandleLidSwitch*=ignore in hosts/laptop, see
# docs/mango-laptop-handoff.md item 2):
#   switchbind=fold,disable_monitor,eDP-1
#   switchbind=unfold,enable_monitor,eDP-1
