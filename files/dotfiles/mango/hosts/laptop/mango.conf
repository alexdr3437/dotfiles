# Work laptop: sourced from config.conf via ~/.config/mango-host (home/mango.nix links
# this directory there). Only what differs between machines lives here.

# internal panel (name assumed; confirm with `mmsg get all-monitors` and fix here and
# in env.sh). 2560-wide 13-14" panel → 1.25. No disable rule: monitors.sh turns it off
# whenever another monitor is connected and back on when that goes away, so an undocked
# login still has a screen. The external monitor gets mango's automatic placement.
monitor_rule=name:eDP-1,scale:1.25

# lid: on battery suspend, on AC lock and sleep the panel; open wakes it if it is in
# use. logind must leave the lid alone (HandleLidSwitch*=ignore in hosts/laptop).
switchbind=fold,spawn,/home/alex/.config/mango/monitors.sh fold
switchbind=unfold,spawn,/home/alex/.config/mango/monitors.sh unfold
