# Work laptop: sourced from config.conf via ~/.config/mango-host (home/mango.nix links
# this directory there). Only what differs between machines lives here.

# internal panel (eDP-1 per /sys/class/drm), 2560-wide → 1.25. No disable rule: monitors.sh
# turns it off whenever another monitor is connected and back on when that goes, so a
# login without the HDMI monitor still has a screen. The external gets mango's automatic placement.
monitor_rule=name:eDP-1,scale:1.25

# lid: on battery suspend, on AC lock and sleep the panel; opening wakes it if it is in use.
# logind must leave the lid alone (HandleLidSwitch*=ignore in hosts/laptop/default.nix).
switchbind=fold,spawn,/home/alex/.config/mango/monitors.sh fold
switchbind=unfold,spawn,/home/alex/.config/mango/monitors.sh unfold
